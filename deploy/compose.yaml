name: foxden-media

x-hardening: &hardening
  user: "${FOXDEN_PUID:-10001}:${FOXDEN_PGID:-10001}"
  init: true
  read_only: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777"]
  networks: [platform, outbound]
  mem_limit: "${FOXDEN_APP_MEMORY_LIMIT:-1g}"
  cpus: "${FOXDEN_APP_CPUS:-2.0}"

x-music-environment: &music-environment
  APP_ENVIRONMENT: production
  CONFIG_DIR: /config
  STAGING_DIR: /staging
  DATABASE_URL: sqlite:////config/foxden-music.db
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  FILE_UMASK: "${FILE_UMASK:-0027}"
  MUSICBRAINZ_CONTACT: "${MUSICBRAINZ_CONTACT:-}"
  MUSICBRAINZ_BASE_URL: "${MUSICBRAINZ_BASE_URL:-https://musicbrainz.org/ws/2}"
  COVER_ART_BASE_URL: "${COVER_ART_BASE_URL:-https://coverartarchive.org}"
  DOWNLOAD_INBOX_DIR: /downloads
  DOWNLOAD_INBOX_AUTO_IMPORT: "${DOWNLOAD_INBOX_AUTO_IMPORT:-true}"
  MUSIC_REQUEST_AUTO_IMPORT: "${MUSIC_REQUEST_AUTO_IMPORT:-false}"
  # Browser actions require an explicitly selected optional Firefox profile.
  REMOTE_BROWSER_URL: "${REMOTE_BROWSER_URL:-}"
  # Match the Music toolbar destination to Firefox FF_OPEN_URL.
  BROWSER_HOME_URL: "${BROWSER_HOME_URL:-https://spotidownloader.com/}"
  FOXDEN_IDENTITY_PUBLIC_KEYS_FILE: /run/identity/public.json
  FOXDEN_IDENTITY_ISSUER: "${FOXDEN_IDENTITY_ISSUER:-foxden-portal}"
  FOXDEN_IDENTITY_AUDIENCE: music
  FOXDEN_PUBLIC_ORIGIN: "${FOXDEN_PUBLIC_ORIGIN:?Set FOXDEN_PUBLIC_ORIGIN}"
  WEB_ROOT_PATH: /music

x-music-service: &music-service
  <<: *hardening
  user: "${MUSIC_PUID:-10001}:${MUSIC_PGID:-10001}"
  image: "${MUSIC_IMAGE:-foxden-music:2.5.1-monorepo}"
  build:
    context: ../apps/music/backend
    args:
      APP_UID: "${MUSIC_PUID:-10001}"
      APP_GID: "${MUSIC_PGID:-10001}"
  profiles: [music]
  environment: *music-environment

services:
  ingress:
    image: "${NGINX_IMAGE:-nginx:1.28.0-alpine}"
    user: "${FOXDEN_PUID:-10001}:${FOXDEN_PGID:-10001}"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
    ports: ["${FOXDEN_BIND_IP:-127.0.0.1}:${FOXDEN_PORT:-8080}:8080"]
    volumes:
      - "${FOXDEN_RUNTIME_DIR:?Set FOXDEN_RUNTIME_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro"
    networks: [edge, platform]
    mem_limit: "${FOXDEN_INGRESS_MEMORY_LIMIT:-256m}"
    cpus: "${FOXDEN_INGRESS_CPUS:-1.0}"
    depends_on:
      portal: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 5

  portal:
    <<: *hardening
    image: "${PORTAL_IMAGE:-foxden-portal:0.9.9}"
    build:
      context: ../apps/portal
      args:
        APP_UID: "${FOXDEN_PUID:-10001}"
        APP_GID: "${FOXDEN_PGID:-10001}"
    environment:
      PORTAL_DATABASE_PATH: /config/portal.db
      PORTAL_PUBLIC_URL: "${FOXDEN_PUBLIC_ORIGIN:?Set FOXDEN_PUBLIC_ORIGIN}"
      PORTAL_COOKIE_SECURE: "${PORTAL_COOKIE_SECURE:-true}"
      PORTAL_AUTH_MODE: "${PORTAL_AUTH_MODE:-local}"
      PORTAL_SECRET_KEY_FILE: /run/secrets/portal-secret
      PORTAL_BOOTSTRAP_SECRET_FILE: /run/secrets/portal-bootstrap
      PORTAL_IDENTITY_PRIVATE_KEY_FILE: /run/identity/private.pem
      PORTAL_IDENTITY_SIGNING_KID: "${PORTAL_IDENTITY_SIGNING_KID:-foxden-portal-1}"
      PORTAL_IDENTITY_ISSUER: "${FOXDEN_IDENTITY_ISSUER:-foxden-portal}"
      PORTAL_INGRESS_AUTH_SECRET_FILE: /run/secrets/ingress-auth
      PORTAL_MODULES_JSON: "${PORTAL_MODULES_JSON:-[]}"
      PORTAL_JELLYFIN_URL: "${JELLYFIN_PUBLIC_URL:-}"
      PORTAL_JELLYFIN_INTERNAL_URL: "${JELLYFIN_INTERNAL_URL:-}"
      PORTAL_JELLYFIN_TOKEN_SECRET_FILE: /run/secrets/portal-secret
      PORTAL_JELLYFIN_TIMEOUT_SECONDS: "${JELLYFIN_TIMEOUT_SECONDS:-4.0}"
      PORTAL_OIDC_ISSUER: "${PORTAL_OIDC_ISSUER:-}"
      PORTAL_OIDC_CLIENT_ID: "${PORTAL_OIDC_CLIENT_ID:-}"
      PORTAL_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc-client-secret
      PORTAL_OIDC_REDIRECT_URI: "${PORTAL_OIDC_REDIRECT_URI:-}"
      PORTAL_OIDC_SCOPES: "${PORTAL_OIDC_SCOPES:-openid profile email}"
      PORTAL_OIDC_ALLOWED_GROUPS: "${PORTAL_OIDC_ALLOWED_GROUPS:-}"
      PORTAL_OIDC_ADMIN_GROUPS: "${PORTAL_OIDC_ADMIN_GROUPS:-}"
    volumes:
      - type: bind
        source: "${PORTAL_CONFIG_PATH:?Set PORTAL_CONFIG_PATH}"
        target: /config
        bind: {create_host_path: false}
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/portal-secret:/run/secrets/portal-secret:ro"
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/portal-bootstrap:/run/secrets/portal-bootstrap:ro"
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/ingress-auth:/run/secrets/ingress-auth:ro"
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/identity-private.pem:/run/identity/private.pem:ro"
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/oidc-client-secret:/run/secrets/oidc-client-secret:ro"
    expose: ["8020"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  music:
    <<: *music-service
    command: [foxden-music-web]
    environment:
      <<: *music-environment
      MUSIC_DIR: /tmp/foxden-web-no-library
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
      CSRF_SECRET_FILE: /run/secrets/music-csrf
    volumes:
      - {type: bind, source: "${MUSIC_CONFIG_PATH:-./.disabled/music-config}", target: /config, bind: {create_host_path: false}}
      - {type: bind, source: "${MUSIC_STAGING_PATH:-./.disabled/music-staging}", target: /staging, bind: {create_host_path: false}}
      - {type: bind, source: "${MUSIC_DOWNLOAD_PATH:-./.disabled/music-downloads}", target: /downloads, bind: {create_host_path: false}}
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/identity-public.json:/run/identity/public.json:ro"
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/music-csrf:/run/secrets/music-csrf:ro"
    expose: ["8000"]
    healthcheck:
      test: [CMD, python, -m, foxden_music.healthcheck, web]
      interval: 30s
      timeout: 5s
      retries: 4

  music-worker:
    <<: *music-service
    command: [foxden-music-worker]
    environment:
      <<: *music-environment
      MUSIC_DIR: /music
      WORKER_POLL_SECONDS: "${MUSIC_WORKER_POLL_SECONDS:-2}"
      JELLYFIN_URL: "${JELLYFIN_URL:-}"
      JELLYFIN_API_KEY_FILE: /run/secrets/jellyfin-api-key
    volumes:
      - {type: bind, source: "${MUSIC_CONFIG_PATH:-./.disabled/music-config}", target: /config, bind: {create_host_path: false}}
      - {type: bind, source: "${MUSIC_STAGING_PATH:-./.disabled/music-staging}", target: /staging, bind: {create_host_path: false}}
      - {type: bind, source: "${MUSIC_DOWNLOAD_PATH:-./.disabled/music-downloads}", target: /downloads, bind: {create_host_path: false}}
      - {type: bind, source: "${MUSIC_LIBRARY_PATH:-./.disabled/music-library}", target: /music, bind: {create_host_path: false}}
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/identity-public.json:/run/identity/public.json:ro"
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/jellyfin-api-key:/run/secrets/jellyfin-api-key:ro"
    healthcheck:
      test: [CMD, python, -m, foxden_music.healthcheck, worker]
      interval: 30s
      timeout: 5s
      retries: 4

  media:
    <<: *hardening
    user: "${MEDIA_PUID:-10001}:${MEDIA_PGID:-10001}"
    profiles: [media]
    image: "${MEDIA_IMAGE:-fox-den-media:0.9.9}"
    build:
      context: ..
      dockerfile: apps/media/Dockerfile
      args:
        APP_UID: "${MEDIA_PUID:-10001}"
        APP_GID: "${MEDIA_PGID:-10001}"
    environment:
      CONFIG_DIR: /config
      STAGING_DIR: /downloads
      MEDIA_DIR: /media
      FOX_DEN_IDENTITY_PUBLIC_KEYS_FILE: /run/identity/public.json
      FOX_DEN_IDENTITY_ISSUER: "${FOXDEN_IDENTITY_ISSUER:-foxden-portal}"
      FOX_DEN_PUBLIC_ORIGIN: "${FOXDEN_PUBLIC_ORIGIN:?Set FOXDEN_PUBLIC_ORIGIN}"
      QBIT_URL: "${QBIT_URL:-http://gluetun:8080}"
      QBIT_PUBLIC_URL: "${QBIT_PUBLIC_URL:-}"
      QBIT_USERNAME: "${QBIT_USERNAME:-admin}"
      QBIT_PASSWORD_FILE: /run/secrets/qbit-password
      APP_TOKEN_FILE: /run/secrets/media-app-token
      QBIT_DOWNLOAD_ROOT: /downloads
      MEDIA_BROWSER_HOME_URL: "${MEDIA_BROWSER_HOME_URL:-https://www.themoviedb.org/}"
      COOKIE_SECURE: "${PORTAL_COOKIE_SECURE:-true}"
    volumes:
      - {type: bind, source: "${MEDIA_CONFIG_PATH:-./.disabled/media-config}", target: /config, bind: {create_host_path: false}}
      - {type: bind, source: "${TORRENT_DATA_PATH:-./.disabled/torrents}", target: /downloads, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MEDIA_LIBRARY_PATH:-./.disabled/media-library}", target: /media, bind: {create_host_path: false}}
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/identity-public.json:/run/identity/public.json:ro"
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/qbit-password:/run/secrets/qbit-password:ro"
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/media-app-token:/run/secrets/media-app-token:ro"
    expose: ["8010"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 4

  download-browser:
    profiles: [browser]
    image: "${BROWSER_IMAGE:-jlesage/firefox:v26.09.1@sha256:302aa068dcfa46a2d248771c998f67377383554df8940252caef42b99c13eb65}"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      USER_ID: "${FOXDEN_PUID:-10001}"
      GROUP_ID: "${FOXDEN_PGID:-10001}"
      TZ: "${TZ:-UTC}"
      KEEP_APP_RUNNING: "1"
      DARK_MODE: "1"
      FF_OPEN_URL: "${BROWSER_HOME_URL:-https://spotidownloader.com/}"
      FF_KIOSK: "0"
      FF_PREF_DOWNLOAD_DIR: 'browser.download.dir="/downloads"'
      FF_PREF_DOWNLOAD_FOLDER: "browser.download.folderList=2"
      FF_PREF_USE_DOWNLOAD_DIR: "browser.download.useDownloadDir=true"
    volumes:
      - {type: bind, source: "${BROWSER_CONFIG_PATH:-./.disabled/browser-config}", target: /config, bind: {create_host_path: false}}
      - {type: bind, source: "${MUSIC_DOWNLOAD_PATH:-./.disabled/music-downloads}", target: /downloads, bind: {create_host_path: false}}
    expose: ["5800"]
    networks: [platform, outbound]
    mem_limit: "${FOXDEN_BROWSER_MEMORY_LIMIT:-2g}"
    cpus: "${FOXDEN_BROWSER_CPUS:-2.0}"

  jellyfin:
    profiles: [jellyfin]
    image: "${JELLYFIN_IMAGE:-jellyfin/jellyfin:12.4}"
    user: "${JELLYFIN_PUID:-10001}:${JELLYFIN_PGID:-10001}"
    init: true
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=512m,mode=1777"]
    environment:
      TZ: "${TZ:-UTC}"
      JELLYFIN_PublishedServerUrl: "${JELLYFIN_PUBLIC_URL:-http://jellyfin.invalid}"
    volumes:
      - {type: bind, source: "${JELLYFIN_CONFIG_PATH:-./.disabled/jellyfin-config}", target: /config, bind: {create_host_path: false}}
      - {type: bind, source: "${JELLYFIN_CACHE_PATH:-./.disabled/jellyfin-cache}", target: /cache, bind: {create_host_path: false}}
      - {type: bind, source: "${JELLYFIN_MEDIA_PATH:-./.disabled/jellyfin-media}", target: "${JELLYFIN_MEDIA_CONTAINER_PATH:-/media}", read_only: true, bind: {create_host_path: false}}
    expose: ["8096"]
    networks: [platform, outbound]
    mem_limit: "${JELLYFIN_MEMORY_LIMIT:-4g}"
    cpus: "${JELLYFIN_CPUS:-4.0}"
    stop_grace_period: 1m

  gluetun:
    profiles: [managed]
    image: "${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.41.3}"
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [no-new-privileges:true]
    networks: [platform, outbound]
    mem_limit: "${FOXDEN_VPN_MEMORY_LIMIT:-512m}"
    cpus: "${FOXDEN_VPN_CPUS:-1.0}"
    ports: ["${QBIT_BIND_IP:-127.0.0.1}:${QBIT_WEB_PORT:-8081}:8080/tcp"]
    volumes:
      - {type: bind, source: "${GLUETUN_CONFIG_PATH:-./.disabled/gluetun}", target: /gluetun, bind: {create_host_path: false}}
      - "${FOXDEN_SECRETS_DIR:?Set FOXDEN_SECRETS_DIR}/wireguard-private-key:/run/secrets/wireguard-private-key:ro"
    environment:
      TZ: "${TZ:-UTC}"
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard-private-key
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES:-}"
      WIREGUARD_PUBLIC_KEY: "${WIREGUARD_PUBLIC_KEY:-}"
      WIREGUARD_ENDPOINT_IP: "${WIREGUARD_ENDPOINT_IP:-}"
      WIREGUARD_ENDPOINT_PORT: "${WIREGUARD_ENDPOINT_PORT:-51820}"
      WIREGUARD_ALLOWED_IPS: 0.0.0.0/0
      FIREWALL: "on"
      FIREWALL_INPUT_PORTS: "8080"
      DOT: "off"
      DNS_ADDRESS: "${VPN_DNS_ADDRESS:-1.1.1.1}"
      HEALTH_SMALL_CHECK_TYPE: "${GLUETUN_HEALTH_SMALL_CHECK_TYPE:-dns}"
      HEALTH_TARGET_ADDRESSES: "${GLUETUN_HEALTH_TARGET_ADDRESSES:-cloudflare.com:443,github.com:443}"
      HEALTH_ICMP_TARGET_IPS: "${GLUETUN_HEALTH_ICMP_TARGET_IPS:-1.1.1.1,8.8.8.8}"
      HEALTH_RESTART_VPN: "on"
    healthcheck:
      test: [CMD, /gluetun-entrypoint, healthcheck]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  qbittorrent:
    profiles: [managed]
    image: "${QBIT_IMAGE:-lscr.io/linuxserver/qbittorrent:5.3.0@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f}"
    network_mode: service:gluetun
    mem_limit: "${FOXDEN_QBIT_MEMORY_LIMIT:-2g}"
    cpus: "${FOXDEN_QBIT_CPUS:-2.0}"
    depends_on:
      gluetun: {condition: service_healthy}
    restart: unless-stopped
    # LinuxServer s6 init needs its normal UID/GID drop at startup.
    # Traffic isolation remains enforced by network_mode: service:gluetun.
    environment:
      PUID: "${QBIT_PUID:-10001}"
      PGID: "${QBIT_PGID:-10001}"
      TZ: "${TZ:-UTC}"
      UMASK: "002"
      WEBUI_PORT: "8080"
    volumes:
      - {type: bind, source: "${QBIT_CONFIG_PATH:-./.disabled/qbittorrent}", target: /config, bind: {create_host_path: false}}
      - {type: bind, source: "${TORRENT_DATA_PATH:-./.disabled/torrents}", target: /downloads, bind: {create_host_path: false}}
    stop_grace_period: 2m

networks:
  edge: {}
  platform: {internal: true}
  outbound: {}
