name: Validate Fox Den Media monorepo

on:
  push:
    branches: [dev, main, 'feature/**', 'security/**']
  pull_request:
    branches: [dev, main, 'feature/**', 'security/**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation and deployment modes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: python -m pip install pytest==9.1.1 PyYAML==6.0.3 cryptography==50.0.2
      - name: Source, history, release, and platform tests
        run: |
          python -m compileall -q apps scripts tests
          node --check apps/media/app/static/app.js
          node --check apps/music/backend/src/foxden_music/static/app.js
          python scripts/check_release.py
          python scripts/scan_history_secrets.py
          python -m pytest tests/platform tests/test_integration_compose.py tests/test_ingress_config.py -q
          test -z "$(git ls-tree -r --name-only HEAD | grep '^music/' || true)"
      - name: Render every deployment mode
        run: |
          docker compose --env-file deploy/examples/music.env.example -f deploy/compose.yaml --profile music config --quiet
          docker compose --env-file deploy/examples/media.env.example -f deploy/compose.yaml --profile media config --quiet
          docker compose --env-file deploy/examples/full-external.env.example -f deploy/compose.yaml --profile music --profile media config --quiet
          docker compose --env-file deploy/examples/full-managed.env.example -f deploy/compose.yaml --profile music --profile media --profile managed --profile browser config --quiet
          docker compose --env-file deploy/examples/jellyfin.env.example -f deploy/compose.yaml --profile jellyfin config --quiet
          docker compose --env-file deploy/examples/full-managed.env.example -f deploy/compose.yaml --profile music --profile media --profile managed --profile jellyfin config --quiet
          docker compose --env-file deploy/examples/ugreen-rehearsal.env.example -f deploy/compose.yaml -f deploy/compose.jellyfin-hwaccel.yaml --profile music --profile media --profile managed --profile browser --profile jellyfin config --quiet

  music:
    name: Music regressions and real audio
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: {python: ['3.12', '3.13']}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '${{ matrix.python }}', cache: pip, cache-dependency-path: apps/music/backend/requirements*.txt}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          python -m pip install -r apps/music/backend/requirements-dev.txt
          python -m pip install --no-deps -e apps/music/backend
          python -m pip check
      - name: Full Music suite including single-recording and album completeness
        run: python -m pytest -c apps/music/backend/pyproject.toml apps/music/backend/tests apps/music/ci/test_gates.py --cov=foxden_music --cov-fail-under=78 --junitxml=reports/music-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: 'music-${{ matrix.python }}', path: reports/, retention-days: 14}

  applications:
    name: Portal and Movies TV
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'apps/*/*requirements*.txt'}
      # Pin both the release asset and its checksum so CI does not depend on
      # the GitHub runner's slow Ubuntu apt mirror for FFmpeg provisioning.
      - name: Install verified FFmpeg and FFprobe test binaries
        shell: bash
        env:
          FFMPEG_ARCHIVE_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-05-12-48/ffmpeg-n8.1.3-34-ga35157abb9-linux64-gpl-8.1.tar.xz
          FFMPEG_ARCHIVE_SHA256: 1bbd8ff31a24ecbe0714f21e47cc0c4382cc51340c32d5d35fc6fda44e168ab5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/foxden-ci-ffmpeg.tar.xz"
          extract_dir="$RUNNER_TEMP/foxden-ci-ffmpeg"
          bin_dir="$RUNNER_TEMP/foxden-ci-bin"
          mkdir -p "$extract_dir" "$bin_dir"
          curl --fail --location --retry 2 --retry-delay 2 \
            --retry-max-time 360 --connect-timeout 15 --max-time 240 \
            "$FFMPEG_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$FFMPEG_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar -xJf "$archive" -C "$extract_dir" --no-same-owner
          ffmpeg_bin="$(find "$extract_dir" -type f -path '*/bin/ffmpeg' -print -quit)"
          ffprobe_bin="$(find "$extract_dir" -type f -path '*/bin/ffprobe' -print -quit)"
          test -n "$ffmpeg_bin" && test -n "$ffprobe_bin"
          install -m 0755 "$ffmpeg_bin" "$bin_dir/ffmpeg"
          install -m 0755 "$ffprobe_bin" "$bin_dir/ffprobe"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/ffmpeg" -version
          "$bin_dir/ffprobe" -version
      - run: |
          python -m pip install -r apps/media/requirements-dev.txt
          python -m pip install -e 'apps/portal[test]'
          python -m pip install PyYAML==6.0.3
      - name: Movies TV tests
        env: {PYTHONPATH: 'apps/media:apps/portal/src'}
        run: |
          python -m pytest apps/media/tests -q --junitxml=reports/media-app.xml
          python -m pytest tests -q --ignore=tests/platform --junitxml=reports/media-platform.xml
      - name: Portal tests
        env: {PYTHONPATH: 'apps/media:apps/portal/src'}
        run: python -m pytest -c apps/portal/pyproject.toml apps/portal/tests -q --junitxml=reports/portal.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: portal-media, path: reports/, retention-days: 14}

  audit:
    name: Dependency vulnerability audits
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install pip-audit==2.10.1
      - run: |
          mkdir -p reports
          python -m pip_audit --strict -r apps/music/backend/requirements.txt --format json --output reports/music-audit.json
          python -m pip_audit --strict -r apps/media/requirements.txt --format json --output reports/media-audit.json
          python -m pip_audit --strict apps/portal --format json --output reports/portal-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: dependency-audits, path: reports/, retention-days: 14}

  sast:
    name: Static analysis and secret scan
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install bandit==1.9.4
      - name: Bandit medium and high confidence findings
        run: |
          mkdir -p reports
          python -m bandit -r apps/portal/src apps/media/app apps/music/backend/src \
            --severity-level medium --confidence-level medium \
            --format json --output reports/bandit.json
      - name: Full-history secret scan
        run: python scripts/scan_history_secrets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: static-security-analysis, path: reports/, retention-days: 14}

  migration:
    name: Migration backup restore and rollback
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest==9.1.1 PyYAML==6.0.3 cryptography==50.0.2
      - name: Migration tooling unit and security tests
        run: mkdir -p reports && python -m pytest tests/platform/test_migration.py -q --junitxml=reports/migration.xml
      - name: Exercise CLI archive restore and rollback with synthetic state
        run: |
          mkdir -p "$RUNNER_TEMP/source/music" "$RUNNER_TEMP/source/qbit/BT_backup" "$RUNNER_TEMP/backups" reports
          printf 'synthetic-sqlite-fixture' > "$RUNNER_TEMP/source/music/foxden-music.db"
          printf 'synthetic-resume-fixture' > "$RUNNER_TEMP/source/qbit/BT_backup/example.fastresume"
          printf 'MUSIC_CONFIG_PATH=%s\nQBIT_CONFIG_PATH=%s\n' \
            "$RUNNER_TEMP/source/music" "$RUNNER_TEMP/source/qbit" > "$RUNNER_TEMP/rehearsal.env"
          python scripts/migration.py backup --env "$RUNNER_TEMP/rehearsal.env" \
            --destination "$RUNNER_TEMP/backups" --source-commit "$GITHUB_SHA" --writers-stopped --execute
          archive="$(find "$RUNNER_TEMP/backups" -maxdepth 1 -name 'foxden-state-*.tar.gz' -print -quit)"
          python scripts/migration.py verify "$archive"
          python scripts/migration.py restore-rehearsal "$archive" \
            --destination "$RUNNER_TEMP/restored" --report reports/restore.json --execute
          python scripts/migration.py rollback-rehearsal "$archive" \
            --destination "$RUNNER_TEMP/rollback" --report reports/rollback.json --execute
          cp "$archive.sha256" "$archive.manifest.json" reports/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: migration-rehearsal, path: reports/, retention-days: 30}

  jellyfin:
    name: Optional Jellyfin container
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python scripts/smoke_jellyfin_container.py

  containers:
    name: Consolidated container integration
    needs: [music, applications, audit, sast, migration, jellyfin]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python scripts/integration_stack.py up
      - run: python scripts/smoke_integration_stack.py
      - name: Synthetic VPN fail-closed fixture
        run: python scripts/test_vpn_fixture.py
      - name: Cleanup
        if: always()
        run: |
          python scripts/integration_stack.py down || true
          docker compose -f tests/fixtures/vpn/compose.yaml down --volumes --remove-orphans || true

  gate:
    name: Monorepo strict gate
    if: always()
    needs: [validation, music, applications, audit, sast, migration, jellyfin, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env: {RESULTS: '${{ toJSON(needs) }}'}
        run: python -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert all(v["result"]=="success" for v in r.values()), r'
