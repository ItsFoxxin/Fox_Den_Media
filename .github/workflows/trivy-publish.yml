name: Publish Trivy PR findings (trusted, advisory)

# Enabled only after this file is on the default main branch.
# Never checks out code from the scanned pull request.
on:
  workflow_run:
    workflows: [Trivy first-party images (advisory)]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: trivy-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: Trivy PR reporting (advisory)
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted main rather than untrusted PR contents
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate provenance and safely update bot-owned comment and labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.trivy_pr_reporting --event "$GITHUB_EVENT_PATH"
