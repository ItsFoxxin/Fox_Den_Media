name: GHCR digest verification (R4; fail-closed)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact approved immutable main commit'
        required: true
        type: string
      publisher_run_id:
        description: 'Successful R3 run with three candidate artifacts'
        required: true
        type: string
      security_run_id:
        description: 'Trusted digest-security producer run with signed contract and lock'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-r4-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify published digests without rebuilding
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prove exact main and source producer runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISHER_RUN: ${{ inputs.publisher_run_id }}
          SECURITY_RUN: ${{ inputs.security_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLISHER_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$SECURITY_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          for kind in publisher security; do
            if [ "$kind" = publisher ]; then
              run="$PUBLISHER_RUN"; workflow=".github/workflows/ghcr-candidates.yml"
            else
              run="$SECURITY_RUN"; workflow=".github/workflows/trivy-digest-security.yml"
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$RUNNER_TEMP/$kind-run.json"
            jq -e --arg sha "$SOURCE_SHA" --arg path "$workflow" \
              '.head_sha == $sha and .head_branch == "main" and
               .event == "workflow_dispatch" and .path == $path and
               .conclusion == "success" and .status == "completed"' \
              "$RUNNER_TEMP/$kind-run.json"
          done
      - name: Download exact R3 candidate identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_RUN: ${{ inputs.publisher_run_id }}
        run: |
          set -euo pipefail
          mkdir -p candidates
          for name in portal music media; do
            mkdir -p "candidates/$name"
            gh run download "$PUBLISHER_RUN" \
              --repo "$GITHUB_REPOSITORY" --name "ghcr-candidate-$name" \
              --dir "candidates/$name"
            test -s "candidates/$name/$name.json"
            cp "candidates/$name/$name.json" "candidates/$name.json"
          done
      - name: Download signed shared digest scan and complete release lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_RUN: ${{ inputs.security_run_id }}
        run: |
          set -euo pipefail
          mkdir -p security
          gh run download "$SECURITY_RUN" --repo "$GITHUB_REPOSITORY" \
            --name ghcr-security-contract-v1 --dir security
          test -s security/security-contract.json
          test -s security/release-lock.json
          test -s security/rendered-release-compose.json
          test -d security/reports
          gh attestation verify security/security-contract.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/trivy-digest-security.yml"
      - name: Verify image provenance, registry identity and release policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISHER_RUN: ${{ inputs.publisher_run_id }}
        run: |
          set -euo pipefail
          python scripts/verify_image_security.py --contract security/security-contract.json \
            --lock security/release-lock.json --evidence-dir security/reports \
            --candidates candidates --source-sha "$SOURCE_SHA" \
            --publisher-run-id "$PUBLISHER_RUN"
          python scripts/release_lock.py security/release-lock.json \
            --compose deploy/compose.yaml \
            --rendered security/rendered-release-compose.json \
            --source-sha "$SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("security/release-lock.json").read_text())
          for component in ("portal", "music", "media"):
              candidate = json.loads(Path(f"candidates/{component}.json").read_text())
              assert lock["images"][component]["ref"] == (
                  candidate["image"] + "@" + candidate["digest"]
              ), "Candidate versus lock image drift"
              assert lock["images"][component]["platform_digest"] == (
                  candidate["platform_digest"].removeprefix("sha256:")
              ), "Platform digest differs"
          print("Candidate images match complete release lock")
          PY
          # gh <= 2.101.0 allowed prefix matches for --signer-workflow.
          gh_version="$(gh --version | head -n1 | awk '{print $3}')"
          python - "$gh_version" <<'PY'
          import sys
          try:
              parts = tuple(int(x) for x in sys.argv[1].split(".")[:3])
          except ValueError as exc:
              raise SystemExit("Unknown gh version; fail closed") from exc
          if parts < (2, 102, 0):
              raise SystemExit("gh 2.102+ required for exact workflow signer validation")
          PY
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          for component in portal music media; do
            image="$(jq -er .image "candidates/$component.json")"
            digest="$(jq -er .digest "candidates/$component.json")"
            gh attestation verify "oci://$image@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ghcr-candidates.yml"
            docker buildx imagetools inspect "$image@$digest" --raw > "$RUNNER_TEMP/$component-oci.json"
            test "$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | unique | length' "$RUNNER_TEMP/$component-oci.json")" = 1
            test "$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | first' "$RUNNER_TEMP/$component-oci.json")" = "$(jq -er .platform_digest "candidates/$component.json")"
          done
      - name: Run disposable integration using pulled digests only
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/no_rebuild_integration.py --lock security/release-lock.json
      - name: Record R4 identity report (not publication approval)
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          echo "Verified published digest identity and no-build synthetic integration for $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "This run neither tags a 1.0.0 release nor approves NAS production cutover." >> "$GITHUB_STEP_SUMMARY"
