name: Trusted GHCR digest security evidence (R4 producer)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'collect raw evidence A or finalize independently reviewed v2 C'
        required: true
        type: choice
        options: [collect, finalize]
      scan_run_id:
        description: 'Completed authenticated A scan run; required for finalize'
        required: false
        type: string
      review_run_id:
        description: 'Completed independent B review run; required for finalize'
        required: false
        type: string
      source_sha:
        description: 'Exact separately approved main source SHA'
        required: true
        type: string
      publisher_run_id:
        description: 'Successful, authorized R3 GHCR candidate run'
        required: true
        type: string

# Manual + protected environment ONLY. No push/PR/workflow_run trigger,
# packages:write, release tag, build, deployment or NAS credentials.
permissions:
  contents: read

concurrency:
  group: ghcr-digest-security-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  collect:
    name: Phase A — authenticated unsuppressed scan collection only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stage == 'collect'
    runs-on: ubuntu-24.04
    environment: ghcr-security
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact source with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify protected authorization, main HEAD and authenticated R3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISHER_RUN: ${{ inputs.publisher_run_id }}
          ENABLED: ${{ vars.GHCR_SECURITY_ENABLED }}
          ENV_PROTECTED: ${{ vars.GHCR_SECURITY_ENV_PROTECTED }}
          APPROVED_SHA: ${{ vars.GHCR_SECURITY_APPROVED_SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$ENABLED" = true && test "$ENV_PROTECTED" = true
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLISHER_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$SOURCE_SHA" = "$APPROVED_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          gh_version="$(gh --version | head -n1 | awk '{print $3}')"
          python scripts/ghcr_digest_security.py check-gh-version "$gh_version"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN" > "$RUNNER_TEMP/r3-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" '
            .repository.full_name == $repo and
            .head_sha == $sha and .head_branch == "main" and
            .event == "workflow_dispatch" and
            .path == ".github/workflows/ghcr-candidates.yml" and
            .status == "completed" and .conclusion == "success"
          ' "$RUNNER_TEMP/r3-run.json"
      - name: Load owner-reviewed lock and safe rendered image-only Compose
        shell: bash
        env:
          LOCK_B64: ${{ vars.GHCR_SECURITY_LOCK_B64 }}
          RENDERED_B64: ${{ vars.GHCR_SECURITY_RENDERED_B64 }}
          LOCK_SHA256: ${{ vars.GHCR_SECURITY_LOCK_SHA256 }}
          RENDERED_SHA256: ${{ vars.GHCR_SECURITY_RENDERED_SHA256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$LOCK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RENDERED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$LOCK_B64" && test -n "$RENDERED_B64"
          mkdir -p security/reports candidates
          printf '%s' "$LOCK_B64" | base64 --decode > security/release-lock.json
          printf '%s' "$RENDERED_B64" | base64 --decode > security/rendered-release-compose.json
          test "$(sha256sum security/release-lock.json | cut -d' ' -f1)" = "$LOCK_SHA256"
          test "$(sha256sum security/rendered-release-compose.json | cut -d' ' -f1)" = "$RENDERED_SHA256"
          # The authoritative R2 validator is delivered by PR #79.
          # Absence is a hard dependency failure, not permission to skip.
          python scripts/release_lock.py security/release-lock.json \
            --compose deploy/compose.yaml \
            --rendered security/rendered-release-compose.json \
            --source-sha "$SOURCE_SHA"
      - name: Download exact candidate artifacts and construct complete scan plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISHER_RUN: ${{ inputs.publisher_run_id }}
        run: |
          set -euo pipefail
          for name in portal music media; do
            mkdir -p "candidates/$name"
            gh run download "$PUBLISHER_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "ghcr-candidate-$name" --dir "candidates/$name"
            test -s "candidates/$name/$name.json"
            cp "candidates/$name/$name.json" "candidates/$name.json"
          done
          python scripts/ghcr_digest_security.py prepare \
            --lock security/release-lock.json \
            --rendered security/rendered-release-compose.json \
            --candidates candidates \
            --upstream-provenance security/upstream-provenance.json \
            --source-sha "$SOURCE_SHA" --publisher-run-id "$PUBLISHER_RUN" \
            --output security/scan-plan.json
      - name: Install existing checksum-verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_trivy.sh "$RUNNER_TEMP/trivy-bin"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Verify every registry digest, signer and platform, then scan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read-only registry authentication; no GHCR write permissions.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          for name in $(jq -r 'keys[]' security/scan-plan.json); do
            ref="$(jq -er --arg name "$name" '.[$name].ref' security/scan-plan.json)"
            repo="$(jq -er --arg name "$name" '.[$name].source_repo' security/scan-plan.json)"
            commit="$(jq -er --arg name "$name" '.[$name].source_sha' security/scan-plan.json)"
            # For upstream, the source SHA is carried by the reviewed signer ledger,
            # not by the release-lock source_sha (which must remain null).
            source_ref="$(jq -er --arg name "$name" '.[$name].source_ref' security/scan-plan.json)"
            workflow="$(jq -er --arg name "$name" '.[$name].signer_workflow' security/scan-plan.json)"
            gh attestation verify "oci://$ref" \
              --repo "$repo" --source-ref "$source_ref" \
              --source-digest "$commit" --signer-workflow "$workflow"
            docker buildx imagetools inspect "$ref" --raw \
              > "security/reports/$name.manifest.json"
            python scripts/ghcr_digest_security.py check-manifest \
              --plan security/scan-plan.json --name "$name" \
              --manifest "security/reports/$name.manifest.json"
            docker pull --platform linux/amd64 "$ref"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")" = "linux/amd64"
            docker image inspect --format '{{.Id}}' "$ref" \
              > "security/reports/$name.image-id"
            trivy image --image-src docker --scanners vuln --format json \
              --exit-code 0 --output "security/reports/$name.vuln.json" "$ref"
            trivy image --image-src docker --scanners vuln --format spdx-json \
              --exit-code 0 --output "security/reports/$name.sbom.spdx.json" "$ref"
          done
          # DB metadata is populated by the successful scans, not the installer.
          trivy version --format json > security/scanner.json
      - name: Create complete signed v2 collection context (NOT a security pass)
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISHER_RUN: ${{ inputs.publisher_run_id }}
        run: |
          set -euo pipefail
          # Original raw scanner and exception policy bytes are preserved.
          test -s security/vulnerability-exceptions.json
          python scripts/ghcr_digest_security.py collect-v2 \
            --plan security/scan-plan.json --reports security/reports \
            --scanner security/scanner.json --policy security/vulnerability-exceptions.json \
            --lock security/release-lock.json \
            --source-sha "$SOURCE_SHA" --publisher-run-id "$PUBLISHER_RUN" \
            --scan-run-id "$GITHUB_RUN_ID" --producer-actor "github:$GITHUB_ACTOR" \
            --output security/context.json
          test -s security/context.json
          echo "Unfiltered A evidence collected; no vulnerability disposition or acceptance claimed." >> "$GITHUB_STEP_SUMMARY"
      - name: Attest exact Phase A source, lock, scanner and policy bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            security/context.json
            security/release-lock.json
            security/rendered-release-compose.json
            security/scanner.json
            security/vulnerability-exceptions.json
      - name: Upload signed original A inputs without clearing severe findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-security-contract-v2-inputs
          path: |
            security/context.json
            security/release-lock.json
            security/rendered-release-compose.json
            security/scanner.json
            security/vulnerability-exceptions.json
            security/reports/
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Phase C — independently reviewed v2 only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stage == 'finalize'
    runs-on: ubuntu-24.04
    environment: ghcr-security
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prove protected source, authenticated R3/A/B workflow runs and producer identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          R3_RUN: ${{ inputs.publisher_run_id }}
          SCAN_RUN: ${{ inputs.scan_run_id }}
          REVIEW_RUN: ${{ inputs.review_run_id }}
          ENABLED: ${{ vars.GHCR_SECURITY_ENABLED }}
          PROTECTED: ${{ vars.GHCR_SECURITY_ENV_PROTECTED }}
          APPROVED_SHA: ${{ vars.GHCR_SECURITY_APPROVED_SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$ENABLED" = true && test "$PROTECTED" = true
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for id in "$R3_RUN" "$SCAN_RUN" "$REVIEW_RUN"; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
          done
          test "$SCAN_RUN" != "$REVIEW_RUN"
          test "$SOURCE_SHA" = "$GITHUB_SHA" && test "$SOURCE_SHA" = "$APPROVED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          gh_version="$(gh --version | head -n1 | awk '{print $3}')"
          python scripts/ghcr_digest_security.py check-gh-version "$gh_version"
          for spec in "r3:$R3_RUN:.github/workflows/ghcr-candidates.yml" \
                      "scan:$SCAN_RUN:.github/workflows/trivy-digest-security.yml" \
                      "review:$REVIEW_RUN:.github/workflows/security-disposition-review.yml"; do
            kind="$(printf '%s' "$spec" | cut -d: -f1)"
            id="$(printf '%s' "$spec" | cut -d: -f2)"
            wf="$(printf '%s' "$spec" | cut -d: -f3-)"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$RUNNER_TEMP/$kind-run.json"
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" --arg wf "$wf" '
              .repository.full_name == $repo and .head_sha == $sha and
              .head_branch == "main" and .event == "workflow_dispatch" and
              .path == $wf and .status == "completed" and .conclusion == "success"
            ' "$RUNNER_TEMP/$kind-run.json" >/dev/null
          done
          SCAN_ACTOR="$(jq -er '.actor.login' "$RUNNER_TEMP/scan-run.json")"
          test -n "$SCAN_ACTOR"
          echo "SCAN_PRODUCER=github:$SCAN_ACTOR" >> "$GITHUB_ENV"
      - name: Download exact signed A and independent signed B artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_RUN: ${{ inputs.scan_run_id }}
          REVIEW_RUN: ${{ inputs.review_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p security reviewed
          cp security/vulnerability-exceptions.json "$RUNNER_TEMP/source-vulnerability-exceptions.json"
          gh run download "$SCAN_RUN" --repo "$GITHUB_REPOSITORY" \
            --name ghcr-security-contract-v2-inputs --dir security
          gh run download "$REVIEW_RUN" --repo "$GITHUB_REPOSITORY" \
            --name security-disposition-review-v1 --dir reviewed
          for name in context.json release-lock.json rendered-release-compose.json scanner.json vulnerability-exceptions.json; do
            test -s "security/$name"
            gh attestation verify "security/$name" \
              --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/main \
              --source-digest "$SOURCE_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/trivy-digest-security.yml"
          done
          test -s reviewed/security/disposition-verification.json
          test -s reviewed/review/dispositions.json
          test -s reviewed/review/signatures.json
          gh attestation verify reviewed/security/disposition-verification.json \
            --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/main \
            --source-digest "$SOURCE_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/security-disposition-review.yml"
          test "$(jq -er '.producer_actor' security/context.json)" = "$SCAN_PRODUCER"
          test "$(jq -er '.scan_run_id' security/context.json)" = "$SCAN_RUN"
      - name: Independently reconstruct R3/OCI image and complete locked A scan context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R3_RUN: ${{ inputs.publisher_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p candidates
          for name in portal music media; do
            mkdir -p "candidates/$name"
            gh run download "$R3_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "ghcr-candidate-$name" --dir "candidates/$name"
            test -s "candidates/$name/$name.json"
            cp "candidates/$name/$name.json" "candidates/$name.json"
          done
          python scripts/release_lock.py security/release-lock.json \
            --compose deploy/compose.yaml \
            --rendered security/rendered-release-compose.json \
            --source-sha "$SOURCE_SHA"
          python scripts/ghcr_digest_security.py prepare \
            --lock security/release-lock.json \
            --rendered security/rendered-release-compose.json \
            --candidates candidates \
            --upstream-provenance security/upstream-provenance.json \
            --source-sha "$SOURCE_SHA" --publisher-run-id "$R3_RUN" \
            --output security/scan-plan.json
          for name in $(jq -r 'keys[]' security/scan-plan.json); do
            ref="$(jq -er --arg n "$name" '.[$n].ref' security/scan-plan.json)"
            repo="$(jq -er --arg n "$name" '.[$n].source_repo' security/scan-plan.json)"
            commit="$(jq -er --arg n "$name" '.[$n].source_sha' security/scan-plan.json)"
            source_ref="$(jq -er --arg n "$name" '.[$n].source_ref' security/scan-plan.json)"
            workflow="$(jq -er --arg n "$name" '.[$n].signer_workflow' security/scan-plan.json)"
            gh attestation verify "oci://$ref" --repo "$repo" \
              --source-ref "$source_ref" --source-digest "$commit" \
              --signer-workflow "$workflow"
          done
          # Policy is read from independently checked-out approved source.
          cmp security/vulnerability-exceptions.json "$RUNNER_TEMP/source-vulnerability-exceptions.json"
      - name: Load ONLY owner-managed trust and current signed lifecycle
        shell: bash
        env:
          TRUST_B64: ${{ vars.SECURITY_DISPOSITION_TRUST_B64 }}
          LEDGER_B64: ${{ vars.SECURITY_DISPOSITION_LIFECYCLE_B64 }}
          LEDGER_SIG_B64: ${{ vars.SECURITY_DISPOSITION_LIFECYCLE_SIG_B64 }}
          LEDGER_SHA: ${{ vars.SECURITY_DISPOSITION_LIFECYCLE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$TRUST_B64" && test -n "$LEDGER_B64" && test -n "$LEDGER_SIG_B64"
          [[ "$LEDGER_SHA" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p trusted
          printf %s "$TRUST_B64" | base64 --decode > trusted/trust.json
          printf %s "$LEDGER_B64" | base64 --decode > trusted/lifecycle.json
          printf %s "$LEDGER_SIG_B64" | base64 --decode > trusted/lifecycle.sig
          test "sha256:$(sha256sum trusted/lifecycle.json | cut -d' ' -f1)" = "$LEDGER_SHA"
      - name: Verify independent Ed25519 review, complete severe inventory and fresh lifecycle
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          R3_RUN: ${{ inputs.publisher_run_id }}
          SCAN_RUN: ${{ inputs.scan_run_id }}
        run: |
          set -euo pipefail
          # PR #93 independent verifier must be separately integrated to
          # approved main. Do NOT copy it from another Worker's branch here.
          test -s scripts/verify_security_dispositions.py
          python -m pip install cryptography==50.0.2
          python scripts/verify_security_dispositions.py verify \
            --context security/context.json --evidence-dir security \
            --dispositions reviewed/review/dispositions.json \
            --proofs-dir reviewed/review \
            --signatures reviewed/review/signatures.json \
            --lifecycle trusted/lifecycle.json \
            --lifecycle-signature trusted/lifecycle.sig \
            --trust trusted/trust.json \
            --lock security/release-lock.json --scanner security/scanner.json \
            --exceptions security/vulnerability-exceptions.json \
            --expected-source-sha "$SOURCE_SHA" --expected-r3-run-id "$R3_RUN" \
            --expected-scan-run-id "$SCAN_RUN" \
            --expected-producer-actor "$SCAN_PRODUCER" \
            --output trusted/revalidated.json
          cmp reviewed/security/disposition-verification.json trusted/revalidated.json
      - name: Assemble strict v2 only, keeping every original report and independent proof
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          R3_RUN: ${{ inputs.publisher_run_id }}
          SCAN_RUN: ${{ inputs.scan_run_id }}
          REVIEW_RUN: ${{ inputs.review_run_id }}
        run: |
          set -euo pipefail
          python scripts/ghcr_digest_security.py finalize-v2 \
            --plan security/scan-plan.json --reports security/reports \
            --scanner security/scanner.json --policy security/vulnerability-exceptions.json \
            --lock security/release-lock.json --context security/context.json \
            --reviewed-result reviewed/security/disposition-verification.json \
            --revalidated-result trusted/revalidated.json \
            --dispositions reviewed/review/dispositions.json \
            --source-sha "$SOURCE_SHA" --publisher-run-id "$R3_RUN" \
            --scan-run-id "$SCAN_RUN" --producer-actor "$SCAN_PRODUCER" \
            --review-run-id "$REVIEW_RUN" --output security/security-contract.json
          test "$(jq -er .schema_version security/security-contract.json)" = 2
          mkdir -p security/review
          cp reviewed/security/disposition-verification.json security/review/disposition-verification.json
          cp reviewed/review/dispositions.json security/review/dispositions.json
          cp reviewed/review/signatures.json security/review/signatures.json
          mkdir -p security/review/proofs
          if [ -d reviewed/review/proofs ]; then
            cp -a reviewed/review/proofs/. security/review/proofs/
          fi
          echo "All signed v2 producer checks completed; no release/publication approval implied." >> "$GITHUB_STEP_SUMMARY"
      - name: Attest exact v2 contract and independently bound evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            security/security-contract.json
            security/context.json
            security/release-lock.json
            security/rendered-release-compose.json
            security/scanner.json
            security/vulnerability-exceptions.json
            security/review/disposition-verification.json
      - name: Upload final v2 signed contract and original unsuppressed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-security-contract-v2
          path: |
            security/security-contract.json
            security/context.json
            security/release-lock.json
            security/rendered-release-compose.json
            security/scanner.json
            security/vulnerability-exceptions.json
            security/reports/
            security/review/
          if-no-files-found: error
          retention-days: 30
