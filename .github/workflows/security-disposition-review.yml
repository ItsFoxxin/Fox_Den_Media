name: Independent R4 security disposition review (v1)
on:
  workflow_dispatch:
    inputs:
      source_sha: {description: "Approved main SHA", required: true, type: string}
      r3_run_id: {description: "Approved R3 run", required: true, type: string}
      scan_run_id: {description: "Trusted Trivy scan input run", required: true, type: string}
      submission_run_id: {description: "Authenticated independent human review submission run", required: true, type: string}
permissions:
  contents: read
concurrency:
  group: disposition-review-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  verify:
    name: Validate independent security dispositions and attest result
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: security-disposition-review
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - name: Verify main SHA, separate run provenance and protected owner gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          R3_ID: ${{ inputs.r3_run_id }}
          SCAN_ID: ${{ inputs.scan_run_id }}
          REVIEW_ID: ${{ inputs.submission_run_id }}
          ENABLED: ${{ vars.SECURITY_DISPOSITION_REVIEW_ENABLED }}
          APPROVED_SHA: ${{ vars.SECURITY_DISPOSITION_APPROVED_SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$ENABLED" = true
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$APPROVED_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          python -c 'import re,subprocess; x=subprocess.check_output(["gh","--version"],text=True).splitlines()[0]; m=re.search(r"([0-9]+)\.([0-9]+)\.([0-9]+)",x); assert m and tuple(map(int,m.groups())) >= (2,102,0), x'
          for spec in "r3:$R3_ID:.github/workflows/ghcr-candidates.yml" \
                      "scan:$SCAN_ID:.github/workflows/trivy-digest-security.yml" \
                      "review:$REVIEW_ID:.github/workflows/security-disposition-submission.yml"; do
            kind="$(printf '%s' "$spec" | cut -d: -f1)"
            id="$(printf '%s' "$spec" | cut -d: -f2)"
            workflow="$(printf '%s' "$spec" | cut -d: -f3-)"
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$RUNNER_TEMP/$kind-run.json"
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" --arg wf "$workflow" '
              .repository.full_name == $repo and .head_sha == $sha and
              .head_branch == "main" and .event == "workflow_dispatch" and
              .path == $wf and .status == "completed" and .conclusion == "success"
            ' "$RUNNER_TEMP/$kind-run.json" >/dev/null
          done
          echo "SCAN_PRODUCER=github:$(jq -er '.actor.login' "$RUNNER_TEMP/scan-run.json")" >> "$GITHUB_ENV"
      - name: Download separate signed scanner and reviewer-submission evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SCAN_ID: ${{ inputs.scan_run_id }}
          REVIEW_ID: ${{ inputs.submission_run_id }}
        run: |
          set -euo pipefail
          mkdir -p security review
          gh run download "$SCAN_ID" --repo "$GITHUB_REPOSITORY" \
            --name ghcr-security-contract-v2-inputs --dir security
          gh run download "$REVIEW_ID" --repo "$GITHUB_REPOSITORY" \
            --name security-disposition-submission-v1 --dir review
          test -s security/context.json && test -s review/dispositions.json
          test -s review/signatures.json
          gh attestation verify security/context.json \
            --repo "$GITHUB_REPOSITORY" --source-digest "$SOURCE_SHA" \
            --signer-workflow .github/workflows/trivy-digest-security.yml
          gh attestation verify review/dispositions.json \
            --repo "$GITHUB_REPOSITORY" --source-digest "$SOURCE_SHA" \
            --signer-workflow .github/workflows/security-disposition-submission.yml
      - name: Load owner-controlled trust and latest lifecycle commitment
        shell: bash
        env:
          TRUST_B64: ${{ vars.SECURITY_DISPOSITION_TRUST_B64 }}
          LEDGER_B64: ${{ vars.SECURITY_DISPOSITION_LIFECYCLE_B64 }}
          LEDGER_SIG_B64: ${{ vars.SECURITY_DISPOSITION_LIFECYCLE_SIG_B64 }}
          LEDGER_SHA: ${{ vars.SECURITY_DISPOSITION_LIFECYCLE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$TRUST_B64" && test -n "$LEDGER_B64" && test -n "$LEDGER_SIG_B64"
          [[ "$LEDGER_SHA" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf %s "$TRUST_B64" | base64 --decode > review/trust.json
          printf %s "$LEDGER_B64" | base64 --decode > review/lifecycle.json
          printf %s "$LEDGER_SIG_B64" | base64 --decode > review/lifecycle.sig
          test "sha256:$(sha256sum review/lifecycle.json | cut -d' ' -f1)" = "$LEDGER_SHA"
      - name: Verify original findings, independent review, owner concurrence and expiry
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          R3_ID: ${{ inputs.r3_run_id }}
          SCAN_ID: ${{ inputs.scan_run_id }}
        run: |
          set -euo pipefail
          python -m pip install cryptography==50.0.2
          python scripts/verify_security_dispositions.py verify \
            --context security/context.json --evidence-dir security \
            --dispositions review/dispositions.json --proofs-dir review \
            --signatures review/signatures.json --lifecycle review/lifecycle.json \
            --lifecycle-signature review/lifecycle.sig --trust review/trust.json \
            --lock security/release-lock.json --scanner security/scanner.json \
            --exceptions security/vulnerability-exceptions.json \
            --expected-source-sha "$SOURCE_SHA" --expected-r3-run-id "$R3_ID" \
            --expected-scan-run-id "$SCAN_ID" \
            --expected-producer-actor "$SCAN_PRODUCER" \
            --output security/disposition-verification.json
      - name: Sign independent verification through GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: security/disposition-verification.json
      - name: Upload exact independently authenticated review result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-disposition-review-v1
          path: |
            security/disposition-verification.json
            review/dispositions.json
            review/signatures.json
            review/proofs/
            review/lifecycle.json
            review/lifecycle.sig
          if-no-files-found: error
          retention-days: 30
