name: Dependency Review

# Run only on PRs. Avoid pull_request_target: PR code is untrusted.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the proposed change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Start with visibility. A finding must not block unrelated PRs
          # until manifest coverage and noise are reviewed.
          warn-only: true
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false
